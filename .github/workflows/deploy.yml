name: Build Images

on:
  workflow_run:
    workflows: ["Testing"]
    types:
      - completed
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Service Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image base
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BASE=ghcr.io/${OWNER}/shortly" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shortener-svc
        uses: docker/build-push-action@v6
        with:
          context: ./src/shortener_svc
          file: ./src/shortener_svc/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/shortener-svc:latest
            ${{ env.IMAGE_BASE }}/shortener-svc:${{ github.sha }}

      - name: Build and push redirect-svc
        uses: docker/build-push-action@v6
        with:
          context: ./src/redirect_svc
          file: ./src/redirect_svc/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/redirect-svc:latest
            ${{ env.IMAGE_BASE }}/redirect-svc:${{ github.sha }}

  package-chart:
    name: Package and Push Helm Chart
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set lowercase registry namespace
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "CHART_REGISTRY=ghcr.io/${OWNER}/helm" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: helm package ./charts/shortly --destination /tmp/chart

      - name: Push Helm chart to GHCR
        run: helm push /tmp/chart/shortly-*.tgz oci://${{ env.CHART_REGISTRY }}
